<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Wooden mannequin</title>
  </head>
  <body>
    <div id="app">
      <canvas id="stage"></canvas>
      <p class="purse" id="purse" hidden>Purse <span id="purse-coins">0</span> coppers</p>
      <p class="hint" id="hint">Collect every find on the lawn · tap the grass to walk · posed limbs reset when he steps off</p>
      <div id="shop" class="shop" hidden>
        <div class="shop-card">
          <header class="shop-head">
            <div>
              <h2>The Other You</h2>
              <p>He buys what the lawn put on you. The moth-gate only answers to a lantern he sold.</p>
            </div>
            <p class="shop-coins">Purse <span id="shop-coins">0</span></p>
            <button type="button" id="shop-close">Close</button>
          </header>
          <section>
            <h3>Sell</h3>
            <ul id="shop-sell"></ul>
          </section>
          <section>
            <h3>Buy</h3>
            <ul id="shop-buy"></ul>
          </section>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
